<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
    <title>MD Reader</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/theme-light.css" />
    <link rel="stylesheet" href="./styles/theme-dark.css" />
    <link rel="stylesheet" href="./styles/print.css" />
  </head>
  <body data-theme="dark">
    <header id="titlebar" class="titlebar">
      <span class="titlebar-icon">📄</span>
      <span id="titlebar-name" class="titlebar-name">MD Reader</span>
      <span id="titlebar-dir" class="titlebar-dir"></span>
    </header>

    <div id="app">
      <aside id="toc" class="toc" aria-label="Sidebar">
        <section id="panel-toc" class="side-section" style="flex: 0 0 55%">
          <div class="side-header">Contents</div>
          <nav id="toc-list" class="toc-list"></nav>
        </section>

        <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>

        <section id="panel-files" class="side-section">
          <div class="side-header">
            <span>Files</span>
            <button id="files-up" type="button" title="Parent folder" aria-label="Parent folder">⬆</button>
          </div>
          <div id="files-path" class="files-path"></div>
          <nav id="files-list" class="files-list"></nav>
        </section>
      </aside>
      <div id="toc-resizer" class="toc-resizer" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

      <main id="main" class="main">
        <div id="search-bar" class="search-bar" hidden>
          <input
            id="search-input"
            type="search"
            placeholder="Find in document…"
            autocomplete="off"
            spellcheck="false"
          />
          <span id="search-count" class="search-count">0 of 0</span>
          <button id="search-prev" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match">▲</button>
          <button id="search-next" type="button" title="Next match (Enter)" aria-label="Next match">▼</button>
          <button id="search-close" type="button" title="Close (Esc)" aria-label="Close search">✕</button>
        </div>

        <div id="notice" class="notice" hidden></div>

        <div id="empty-state" class="empty-state">
          <div class="empty-card">
            <div class="empty-icon">📄</div>
            <h1>MD Reader</h1>
            <p>Drop a <code>.md</code> file or an image here, or press <kbd>Ctrl</kbd>+<kbd>O</kbd>.</p>
            <button id="empty-open" type="button">Open file…</button>
            <div id="recent-list" class="recent-list"></div>
          </div>
        </div>

        <div class="reader">
          <div id="scroller" class="scroller" tabindex="0" hidden>
            <article id="content" class="markdown-body"></article>
          </div>
          <div id="minimap" class="minimap" title="Minimap: click or drag to navigate" hidden></div>
        </div>
      </main>

      <aside id="copilot-panel" class="copilot-panel" hidden aria-label="Copilot">
        <header class="copilot-header">
          <span class="copilot-title">✦ Copilot</span>
          <span class="copilot-model" id="copilot-model"></span>
          <button id="copilot-reset" type="button" title="New conversation" aria-label="New conversation">⟲</button>
          <button id="copilot-close" type="button" title="Close (Ctrl+Shift+C)" aria-label="Close Copilot">✕</button>
        </header>
        <div id="copilot-messages" class="copilot-messages"></div>
        <div id="copilot-suggestions" class="copilot-suggestions"></div>
        <div class="copilot-input">
          <textarea
            id="copilot-prompt"
            rows="2"
            placeholder="Ask about this file, its folder, or search the web…"
            spellcheck="false"
          ></textarea>
          <button id="copilot-send" type="button" title="Send (Enter)" aria-label="Send">➤</button>
        </div>
      </aside>
    </div>

    <footer id="status-bar" class="status-bar">
      <span class="status-actions">
        <button id="act-toc" class="icon-btn" type="button" title="Toggle sidebar (Ctrl+\)" aria-label="Toggle sidebar">☰</button>
        <button id="act-back" class="icon-btn" type="button" title="Back (Alt+←)" aria-label="Back">←</button>
        <button id="act-forward" class="icon-btn" type="button" title="Forward (Alt+→)" aria-label="Forward">→</button>
        <button id="act-open" class="text-btn" type="button" title="Open file (Ctrl+O)">📂 Open</button>
        <button id="act-reload" class="icon-btn" type="button" title="Reload file (F5)" aria-label="Reload file">⟳</button>
        <button id="act-find" class="text-btn" type="button" title="Find in document (Ctrl+F)">🔍 Find</button>
        <button id="act-edit" class="text-btn" type="button" title="Edit this document (Ctrl+E)" disabled>✎ Edit</button>
        <button
          id="act-copy-source"
          class="text-btn"
          type="button"
          title="Copy the full Markdown source to the clipboard (Ctrl+Shift+M)"
          disabled
        >
          📋 Copy Markdown
        </button>
      </span>
      <span id="status-file" class="status-file">No file open</span>
      <button
        id="act-copy-path"
        class="icon-btn copy-path-btn"
        type="button"
        title="Copy file path (Ctrl+Shift+P)"
        aria-label="Copy file path"
        disabled
      >
        ⧉
      </button>
      <span id="status-edit" class="status-edit" role="status" aria-live="polite" hidden></span>
      <span id="status-stats" class="status-stats"></span>
      <span class="status-right">
        <button id="act-copilot" class="text-btn accent" type="button" title="Copilot (Ctrl+Shift+C)">✦ Copilot</button>
        <button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme (Ctrl+Shift+T)" aria-label="Toggle theme">🌙</button>
        <button id="width-toggle" class="icon-btn" type="button" title="Toggle reading width (Ctrl+Shift+W)" aria-label="Toggle reading width">↔</button>
        <button
          id="minimap-toggle"
          class="icon-btn"
          type="button"
          title="Toggle minimap (Ctrl+M)"
          aria-label="Toggle minimap"
          aria-pressed="true"
        >
          ▥
        </button>
        <span class="zoom-group">
          <button id="zoom-out" class="icon-btn" type="button" title="Zoom out (Ctrl+-)" aria-label="Zoom out">−</button>
          <button id="status-zoom" class="icon-btn" type="button" title="Reset zoom (Ctrl+0)" aria-label="Reset zoom">100%</button>
          <button id="zoom-in" class="icon-btn" type="button" title="Zoom in (Ctrl+=)" aria-label="Zoom in">+</button>
        </span>
        <button id="act-help" class="icon-btn" type="button" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">?</button>
      </span>
    </footer>

    <div id="drop-overlay" class="drop-overlay" hidden>Drop the file to open it</div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
